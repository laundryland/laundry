<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Cetak Struk Gaji</title>
  <style>
    /* Format Tampilan Layar */
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f4f4;
    }

    .btn-cetak {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .btn-cetak:hover {
      background-color: #0056b3;
    }

    /* Container Struk */
    .struk {
      width: 58mm;
      background: white;
      padding: 5mm 2mm;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      box-sizing: border-box;
      font-size: 11px;
      line-height: 1.3;
    }

    /* Ukuran Logo 2 cm */
    .logo {
      width: 2cm;
      height: auto;
      display: block;
      margin: 0 auto 8px auto;
    }

    .header-text {
      text-align: center;
      margin-bottom: 10px;
    }

    .divider {
      border-top: 1px dashed #000;
      margin: 6px 0;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
    }

    .bold {
      font-weight: bold;
    }

    /* CSS Khusus Cetak / PDF */
    @media print {
      @page {
        size: 58mm auto; /* Lebar 58mm, tinggi menyesuaikan */
        margin: 0; /* Hilangkan margin bawaan printer */
      }

      body {
        background-color: white;
        padding: 0;
        margin: 0;
      }

      .btn-cetak {
        display: none; /* Sembunyikan tombol saat dicetak */
      }

      .struk {
        box-shadow: none;
        width: 58mm;
        padding: 2mm;
      }
    }
  </style>
</head>
<body>

  <!-- Tombol Cetak -->
  <button class="btn-cetak" onclick="window.print()">Cetak PDF</button>

  <!-- Area Struk -->
  <div class="struk">
    <!-- Logo 2 cm -->
    <img src="https://via.placeholder.com/200x200?text=Logo" alt="Logo Perusahaan" class="logo">

    <div class="header-text">
      <div class="bold">PT UTAMA JAYA</div>
      <div>Slip Gaji Karyawan</div>
    </div>

    <div class="divider"></div>

    <!-- Rincian Gaji -->
    <div class="row">
      <span>Gaji Pokok</span>
      <span>3.500.000</span>
    </div>
    <div class="row">
      <span>Tunjangan</span>
      <span>500.000</span>
    </div>

    <div class="divider"></div>

    <!-- Total Gaji menggantikan Subtotal -->
    <div class="row bold">
      <span>Total Gaji</span>
      <span>4.000.000</span>
    </div>

    <div class="divider"></div>

    <!-- Rincian Potongan -->
    <div class="row">
      <span>BPJS</span>
      <span>100.000</span>
    </div>
    <div class="row">
      <span>PPH 21</span>
      <span>50.000</span>
    </div>

    <div class="divider"></div>

    <!-- Total Potongan menggantikan Subtotal Potongan -->
    <div class="row bold">
      <span>Total Potongan</span>
      <span>150.000</span>
    </div>

    <div class="divider"></div>

    <!-- Take Home Pay -->
    <div class="row bold" style="font-size: 12px;">
      <span>Gaji Bersih</span>
      <span>3.850.000</span>
    </div>
  </div>

</body>
</html>
