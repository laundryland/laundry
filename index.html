<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Struk Print</title>

    <!-- Meta & Logo PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="182x182" href="icon-182x182.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512x512.png">
    <link rel="apple-touch-icon" href="icon-512x512.png">

    <!-- Library Tambahan Fitur PDF & JPG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* Styling Khusus Ukuran 58mm */
        .lembar-cetak {
            width: 58mm;
            padding: 5px;
            font-family: monospace;
            font-size: 12px;
            background: #fff;
            margin: auto;
        }

        .kop {
            text-align: center;
            margin-bottom: 10px;
        }

        /* Penyesuaian Tampilan Logo PWA di Kop */
        .kop img.logo-pwa {
            width: 48px;
            height: 48px;
            object-fit: contain;
            display: block;
            margin: 0 auto 5px auto;
        }

        /* Pengaturan Cetak Printer Thermal 58mm */
        @media print {
            body * {
                visibility: hidden;
            }
            .tombol-aksi {
                display: none !important;
            }
            .lembar-cetak, .lembar-cetak * {
                visibility: visible;
            }
            .lembar-cetak {
                position: absolute;
                left: 0;
                top: 0;
                width: 58mm !important;
            }
            @page {
                size: 58mm auto;
                margin: 0;
            }
        }

        /* Tombol Aksi */
        .tombol-aksi {
            text-align: center;
            margin-bottom: 15px;
        }
        .tombol-aksi button {
            padding: 6px 12px;
            margin: 2px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Tombol Fungsi Tambahan -->
    <div class="tombol-aksi">
        <button onclick="window.print()">Cetak (58mm)</button>
        <button onclick="downloadPDF()">Simpan PDF (58mm)</button>
        <button onclick="downloadJPG()">Simpan JPG</button>
        <button onclick="shareWA()">Share WA</button>
    </div>

    <!-- Lembar Cetak / Nota -->
    <div class="lembar-cetak" id="area-cetak">
        
        <!-- Kop dengan Logo PWA -->
        <div class="kop">
            <img src="icon-182x182.png" alt="Logo" class="logo-pwa">
            <h3>NAMA TOKO</h3>
            <p>Alamat Toko Lengkap<br>No. Telp / WA</p>
        </div>

        <hr>

        <!-- Isi Nota Asli Kamu / Dynamic Content -->
        <div class="isi-nota">
            <p>No: #001</p>
            <p>Tgl: 06/09/2026</p>
            <hr>
            <p>Item 1 x1 = 10.000</p>
            <p>Item 2 x2 = 20.000</p>
            <hr>
            <p><strong>Total: 30.000</strong></p>
        </div>

        <hr>

        <div class="kop">
            <p>Terima Kasih</p>
        </div>
    </div>

    <!-- Script Fungsi Tambahan -->
    <script>
        // Export JPG
        function downloadJPG() {
            const element = document.getElementById('area-cetak');
            html2canvas(element, { scale: 2 }).then(canvas => {
                const a = document.createElement('a');
                a.href = canvas.toDataURL('image/jpeg');
                a.download = 'struk.jpg';
                a.click();
            });
        }

        // Export PDF Ukuran Lebar 58mm
        function downloadPDF() {
            const element = document.getElementById('area-cetak');
            const opt = {
                margin: 0,
                filename: 'struk.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: [58, 140], orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }

        // Share Text ke WhatsApp
        function shareWA() {
            const text = encodeURIComponent("NAMA TOKO\nNo: #001\nTotal: 30.000\nTerima Kasih");
            window.open(`https://wa.me/?text=${text}`, '_blank');
        }
    </script>
</body>
</html>
